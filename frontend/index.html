<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#f7f5ef"/><title>Sahayak AI | Scheme guide</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>/* Inline boot and result loader. Self-contained so it renders before JavaScript or network fonts. */
.sahayak-loader{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;color:#242424;background:#fbfbfa;min-height:100dvh;padding:32px 18px}
.sahayak-loader.compact{min-height:240px;gap:12px;padding:24px}
.loader-cast{position:relative;width:260px;height:260px;display:block;min-height:0;margin:0 0 22px;animation:loader-orbit 7s linear 1.8s infinite;transform-origin:center;isolation:isolate}
.loader-cast:after{content:'';position:absolute;inset:8px;border:1px solid #e1dbc5;border-radius:50%;z-index:0;animation:loader-ring-in 1.8s ease-out both}
.loader-cast .loader-person{position:absolute;left:calc(50% - 32px);top:calc(50% - 52px);transform-origin:center center;z-index:1;animation:loader-counter-orbit 7s linear 1.8s infinite}
.loader-cast .loader-person:nth-child(1){--from-x:calc(-50vw + 57px);--from-y:calc(-50dvh + 80px);--to-x:0px;--to-y:-101px}
.loader-cast .loader-person:nth-child(2){--from-x:calc(50vw - 57px);--from-y:calc(-50dvh + 80px);--to-x:101px;--to-y:0px}
.loader-cast .loader-person:nth-child(3){--from-x:calc(50vw - 57px);--from-y:calc(50dvh - 80px);--to-x:0px;--to-y:101px}
.loader-cast .loader-person:nth-child(4){--from-x:calc(-50vw + 57px);--from-y:calc(50dvh - 80px);--to-x:-101px;--to-y:0px}
.loader-cast .loader-person{animation:loader-counter-orbit 7s linear 1.8s infinite,loader-enter 1.8s cubic-bezier(.2,.75,.25,1) both}
.loader-cast .loader-person .legs{animation:loader-walk .34s ease-in-out 5 alternate;transform-origin:50% 0}
.loader-person{position:relative;display:block;width:64px;height:104px;transform-origin:center}

.loader-person .head{position:absolute;left:19px;top:4px;width:27px;height:30px;border-radius:45% 45% 47% 47%;background:#b57e5f;box-shadow:inset -4px -2px #9f6b4d}.loader-person.elder .head{background:#bb9277}.loader-person.woman .head{background:#a96d54}
.loader-person .hair{position:absolute;left:16px;top:0;width:33px;height:14px;background:#333431;border-radius:65% 65% 25% 25%}.loader-person.elder .hair{background:#d0d0cc}.loader-person.woman .hair{height:17px;left:14px;width:38px}
.loader-person .body{position:absolute;top:35px;left:12px;width:40px;height:42px;background:#ad9b45;border-radius:12px 12px 6px 6px}.loader-person.elder .body{background:#607262}.loader-person.woman .body{background:#b28273}.loader-person.worker .body{background:#747b8b}
.loader-person .arms{position:absolute;top:40px;left:4px;width:56px;height:33px;border-left:7px solid #b57e5f;border-right:7px solid #b57e5f;border-radius:9px;transform:rotate(var(--arm,0deg))}.loader-person.elder .arms{border-color:#bb9277}.loader-person.woman .arms{border-color:#a96d54}.loader-person.farmer .arms{--arm:-8deg}.loader-person.worker .arms{--arm:8deg}
.loader-person .legs{position:absolute;top:75px;left:17px;width:31px;height:27px;border-left:10px solid #4f574d;border-right:10px solid #4f574d}.loader-person.worker .legs{border-color:#35383f}.loader-person.woman .legs{border-color:#65495a}
.loader-person.farmer:after{content:'';position:absolute;width:37px;height:7px;left:14px;top:0;background:#94753e;border-radius:50%}.loader-person.elder:after{content:'';position:absolute;width:4px;height:62px;background:#766952;right:1px;top:46px;transform:rotate(-8deg)}
.loader-person.woman:after{content:'';position:absolute;left:7px;top:64px;width:50px;height:27px;background:#b28273;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.loader-ground{height:4px;width:260px;max-width:90vw;border-radius:10px;background:#e4dfcb;overflow:hidden}.loader-ground>span{display:block;width:34%;height:100%;background:#b8a43a;animation:loader-progress 1.55s ease-in-out infinite}
.loader-title{font-weight:750;font-size:21px;letter-spacing:-.5px}.loader-sub{font-size:12px;color:#6b6c64;max-width:300px;line-height:1.5}
.sahayak-loader.compact .loader-cast{width:190px;height:190px;transform:none;margin:0 0 10px}.sahayak-loader.compact .loader-cast .loader-person{scale:.64;--from-x:0px;--from-y:0px}.sahayak-loader.compact .loader-cast .loader-person:nth-child(1){--to-x:0px;--to-y:-77px}.sahayak-loader.compact .loader-cast .loader-person:nth-child(2){--to-x:77px;--to-y:0px}.sahayak-loader.compact .loader-cast .loader-person:nth-child(3){--to-x:0px;--to-y:77px}.sahayak-loader.compact .loader-cast .loader-person:nth-child(4){--to-x:-77px;--to-y:0px}.sahayak-loader.compact .loader-title{font-size:15px}
@keyframes loader-enter{from{translate:var(--from-x) var(--from-y);opacity:0}12%{opacity:1}to{translate:var(--to-x) var(--to-y);opacity:1}}@keyframes loader-ring-in{0%,60%{opacity:0;scale:.65}100%{opacity:1;scale:1}}@keyframes loader-walk{from{transform:skewX(-18deg)}to{transform:skewX(18deg)}}@keyframes loader-orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes loader-counter-orbit{from{transform:rotate(0)}to{transform:rotate(-360deg)}}@keyframes loader-progress{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.loader-cast,.loader-cast:after,.loader-cast .loader-person,.loader-cast .loader-person .legs,.loader-ground>span{animation:none!important}.loader-cast .loader-person{translate:var(--to-x) var(--to-y);opacity:1}.loader-ground>span{width:100%;opacity:.65}}
:root[data-theme=dark] .sahayak-loader{background:#111217;color:#f1f1f4}:root[data-theme=dark] .loader-sub{color:#b5b6c0}
</style></head><body><div id="root"><main class="sahayak-loader" role="status" aria-label="Loading Sahayak AI"><div class="loader-cast" aria-hidden="true"><span class="loader-person farmer"><i class="hair"></i><i class="head"></i><i class="arms"></i><i class="body"></i><i class="legs"></i></span><span class="loader-person elder"><i class="hair"></i><i class="head"></i><i class="arms"></i><i class="body"></i><i class="legs"></i></span><span class="loader-person woman"><i class="hair"></i><i class="head"></i><i class="arms"></i><i class="body"></i><i class="legs"></i></span><span class="loader-person worker"><i class="hair"></i><i class="head"></i><i class="arms"></i><i class="body"></i><i class="legs"></i></span></div><div class="loader-title">Sahayak AI</div><div class="loader-sub">Getting your scheme guide ready…</div><div class="loader-ground" aria-hidden="true"><span></span></div></main></div><script type="module" src="/src/main.jsx"></script></body></html>
